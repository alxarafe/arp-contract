# Illustrative fixture only. Real adapters must introspect the database.
apiVersion: arp.physical/v1
id: demo.items
kind: table
source:
  provider: primary
  dialect: mariadb
  schema: demo
  name: items
columns:
- name: id
  nativeType: int
  scalarType: INT32
  nullable: false
  integerRange:
    minimum: '-2147483648'
    maximum: '2147483647'
- name: code
  nativeType: varchar(12)
  scalarType: STRING
  nullable: false
  characterLength:
    value: 12
    unit: CHARACTERS
- name: rating
  nativeType: tinyint signed
  scalarType: INT8
  nullable: false
  integerRange:
    minimum: '-128'
    maximum: '127'
primaryKey:
- id
