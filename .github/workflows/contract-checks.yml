name: Contract checks

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  contract-checks:
    name: contract-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install verifier dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/requirements.txt
      - name: Contract regression tests
        run: python3 -m unittest discover -s tests
      - name: Contract verifiers
        run: |
          python3 tools/check_contract.py
          python3 tools/check_cds_draft.py
          python3 tools/check_cds_compatibility_draft.py
          python3 tools/check_services_draft.py
          python3 tools/check_service_invocation_draft.py
          python3 tools/check_cds_read_draft.py
          python3 tools/check_modules_draft.py
          python3 tools/check_menus_draft.py
          python3 tools/check_cds_listget_draft.py